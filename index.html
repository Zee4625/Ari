<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pentru Ari ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff4d6d;
      --secondary: #c9184a;
      --bg-dark: #0f0f1a;
      --glass: rgba(255, 255, 255, 0.1);
    }

    body {
      margin: 0;
      height: 100vh;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255, 77, 109, 0.2) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(89, 13, 229, 0.2) 0%, transparent 40%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      color: white;
    }

    /* Floating Hearts Background */
    .bg-hearts {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .heart-bg {
      position: absolute;
      bottom: -10px;
      color: rgba(255, 77, 109, 0.3);
      animation: floatUp 15s linear infinite;
      font-size: 20px;
    }

    .card {
      position: relative;
      z-index: 10;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 50px 40px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-width: 450px;
      width: 90%;
      animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .sticker {
      width: 150px;
      height: auto;
      margin-bottom: 20px;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      margin: 10px 0 30px;
      line-height: 1.3;
      text-shadow: 0 4px 20px rgba(255, 77, 109, 0.5);
    }

    .highlight {
      color: var(--primary);
      font-style: italic;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 30px;
      min-height: 120px; /* Space for growing button */
    }

    button {
      font-family: 'Poppins', sans-serif;
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      border-radius: 50px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .yes-button {
      background: linear-gradient(135deg, #ff4d6d 0%, #ff758c 100%);
      color: white;
      padding: 16px 60px;
      font-size: 1.2rem;
      box-shadow: 0 10px 25px rgba(255, 77, 109, 0.4);
    }

    .yes-button:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 35px rgba(255, 77, 109, 0.6);
    }

    .no-button {
      background: rgba(255, 255, 255, 0.05);
      color: #aaa;
      padding: 12px 40px;
      font-size: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .no-button:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.8) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.8; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="bg-hearts" id="heartContainer"></div>

  <div class="card">
    <img src="https://media1.tenor.com/m/7zK3GGyqQ9AAAAAC/cute-love.gif" alt="Cute bear" class="sticker">
    
    <h1>
      Ari, vrei să fii<br>
      <span class="highlight">Valentina mea?</span> 🌹
    </h1>

    <div class="buttons">
      <button class="yes-button" onclick="handleYesClick()">DA, Vreau! ❤️</button>
      <button class="no-button" onclick="handleNoClick()">Nu...</button>
    </div>
  </div>

  <script>
    const messages = [
      "Ești sigură, Ari?",
      "Gândește-te mai bine...",
      "Dar o să fie super!",
      "Ari, te rog...",
      "Îmi frângi inima 💔",
      "Nu accept un nu!",
      "Butonul de NU a obosit..."
    ];

    let messageIndex = 0;

    function handleNoClick() {
      const noButton = document.querySelector('.no-button');
      const yesButton = document.querySelector('.yes-button');

      // Change text
      noButton.textContent = messages[messageIndex];
      messageIndex = (messageIndex + 1) % messages.length;

      // Grow the YES button
      const currentSize = parseFloat(window.getComputedStyle(yesButton).fontSize);
      const currentPadding = parseFloat(window.getComputedStyle(yesButton).paddingTop);
      
      yesButton.style.fontSize = `${currentSize * 1.4}px`;
      yesButton.style.padding = `${currentPadding * 1.2}px ${currentPadding * 2}px`; // Keep aspect ratio
      
      // Make NO button fade slightly visually but stay clickable
      if(messageIndex > 3) {
         noButton.style.opacity = 0.6;
      }
    }

    function handleYesClick() {
      window.location.href = "yes_page.html";
    }

    // Create background hearts
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart-bg');
      heart.innerHTML = '❤';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 5 + 8 + 's'; 
      heart.style.fontSize = Math.random() * 20 + 10 + 'px';
      
      document.getElementById('heartContainer').appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 13000);
    }

    setInterval(createHeart, 600);
  </script>

</body>
</html>
