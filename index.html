<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pentru Ari ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff4d6d;
      --bg-dark: #0f0f1a;
      --glass: rgba(255, 255, 255, 0.1);
    }

    body {
      margin: 0;
      height: 100vh;
      background-color: var(--bg-dark);
      /* Fundal modern */
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255, 77, 109, 0.2) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(89, 13, 229, 0.2) 0%, transparent 40%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      color: white;
    }

    /* Particule inimioare */
    .bg-hearts {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .heart-bg {
      position: absolute;
      bottom: -20px;
      color: rgba(255, 77, 109, 0.3);
      animation: floatUp 15s linear infinite;
      font-size: 20px;
    }

    /* Stilul cardului de sticlă */
    .card {
      position: relative;
      z-index: 10;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 40px 30px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-width: 400px;
      width: 85%;
      transition: transform 0.1s;
    }

    /* Imaginea cat.1.jpg stilizată */
    .cat-img {
      width: 180px;
      height: 180px;
      object-fit: cover; /* Asigură că poza nu se deformează */
      border-radius: 20px;
      border: 4px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      margin-bottom: 20px;
      animation: floatImg 3s ease-in-out infinite;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin: 10px 0 25px;
      line-height: 1.2;
      text-shadow: 0 4px 15px rgba(255, 77, 109, 0.6);
    }

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      min-height: 140px; /* Rezervă spațiu ca să nu sară elementele */
    }

    button {
      font-family: 'Poppins', sans-serif;
      border: none;
      cursor: pointer;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .yes-button {
      background: linear-gradient(135deg, #ff4d6d 0%, #ff758c 100%);
      color: white;
      padding: 14px 50px;
      font-size: 1.1rem;
      box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
      /* Pentru animația de creștere */
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }

    .yes-button:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 30px rgba(255, 77, 109, 0.6);
    }

    .no-button {
      background: rgba(255, 255, 255, 0.1);
      color: #ccc;
      padding: 10px 30px;
      font-size: 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .no-button:hover {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }

    /* Animații */
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 0; }
      10% { opacity: 0.8; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }

    @keyframes floatImg {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Clasa pentru tremurat cand apasa NU */
    .shake {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
      40%, 60% { transform: translate3d(8px, 0, 0); }
    }
  </style>
</head>
<body>

  <div class="bg-hearts" id="heartContainer"></div>

  <div class="card" id="mainCard">
    <img src="cat.1.gif" alt="Pisica draguta" class="cat-img">
    
    <h1>
      Ari, vrei să fii<br>
      <span style="color: #ff4d6d; font-style: italic;">Valentina mea?</span> 🌹
    </h1>

    <div class="buttons">
      <button class="yes-button" id="yesBtn" onclick="handleYesClick()">DA, Vreau! ❤️</button>
      <button class="no-button" id="noBtn" onclick="handleNoClick()">Nu...</button>
    </div>
  </div>

  <script>
    const messages = [
      "Ești sigură, Ari?",
      "Mai gândește-te...",
      "Chiar vrei să spui nu?",
      "Uite ce drăguț e pisoiul!",
      "Ari, te rog...",
      "Ok, gata cu gluma!",
    ];

    let messageIndex = 0;
    let clickCount = 0;
    // Setăm o limită maximă de creștere (de aprox 2.5 ori)
    const MAX_CLICKS = 5; 

    function handleNoClick() {
      const noButton = document.getElementById('noBtn');
      const yesButton = document.getElementById('yesBtn');
      const card = document.getElementById('mainCard');

      // 1. Schimbă textul butonului NU
      noButton.textContent = messages[messageIndex];
      messageIndex = (messageIndex + 1) % messages.length;

      // 2. Animație de tremurat (shake) la card
      card.classList.add('shake');
      setTimeout(() => card.classList.remove('shake'), 400);

      // 3. Crește butonul DA, dar cu limită!
      if (clickCount < MAX_CLICKS) {
        clickCount++;
        // Creștem padding-ul și fontul cu un factor controlat
        const currentFontSize = parseFloat(window.getComputedStyle(yesButton).fontSize);
        const newFontSize = currentFontSize * 1.2; // Crește cu 20%
        
        yesButton.style.fontSize = `${newFontSize}px`;
        // Creștem puțin padding-ul ca să arate bine
        yesButton.style.padding = `${14 + (clickCount * 4)}px ${50 + (clickCount * 10)}px`;
      } 
      
      // 4. Dacă apasă de prea multe ori, ascundem butonul NU de tot
      if (clickCount >= MAX_CLICKS) {
        noButton.style.display = "none";
        // Opțional: schimbăm textul la DA
        yesButton.textContent = "Acum ai doar o opțiune: DA! ❤️";
      }
    }

    function handleYesClick() {
      window.location.href = "yes_page.html";
    }

    // Generator de inimi pe fundal
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart-bg');
      heart.innerHTML = '❤';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 5 + 8 + 's'; 
      heart.style.fontSize = Math.random() * 20 + 10 + 'px';
      document.getElementById('heartContainer').appendChild(heart);
      setTimeout(() => heart.remove(), 13000);
    }
    setInterval(createHeart, 500);
  </script>

</body>
</html>
